name: build and test

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ pkg-config wayland-protocols libwayland-dev \
            libxkbcommon-dev libcairo2-dev libpango1.0-dev \
            libfontconfig1-dev librsvg2-dev libsqlite3-dev \
            libzstd-dev libmagic-dev nlohmann-json3-dev libtomlplusplus-dev
      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
